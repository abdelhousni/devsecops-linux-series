name: examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: INDEX.md and the README mention every example
        run: |
          status=0
          for dir in [0-9][0-9]-*/; do
            grep -q "${dir%/}" INDEX.md || { echo "INDEX.md: no row for ${dir%/}"; status=1; }
            grep -q "${dir%/}" README.md || { echo "README.md: no row for ${dir%/}"; status=1; }
          done
          exit $status
      - name: shellcheck
        run: shellcheck -x lab/*.sh [0-9][0-9]-*/*.sh

  example:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example:
          - 01-rpm-build-and-sign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the book's lab archive
        run: lab/fetch.sh
      - name: The lab is complete
        run: lab/check.sh || { docker pull docker.io/library/oraclelinux:9 && lab/check.sh; }
      - name: The example prints what the entry says
        env:
          EXAMPLE: ${{ matrix.example }}
        run: '"$EXAMPLE/run.sh" | diff "$EXAMPLE/expected.txt" -'
